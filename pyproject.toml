[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-playback-verifier"
dynamic = ["version"]
description = "QA / synthetic-monitoring CLI that verifies web videos actually play and captures proof-of-playback snippets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.44",
    "Pillow>=10.0",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vpv = "vpv.cli:main"
vpv-view = "vpv.viewer:main"

[tool.setuptools.dynamic]
version = { attr = "vpv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vpv = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
