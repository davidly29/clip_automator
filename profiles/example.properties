# VPV profile (one file per website). Run with:  vpv --profile example
#
# Flat "key = value" format. A comment must be on its OWN line (starting with #
# or !) — inline comments after a value are NOT stripped, because '#' is a valid
# value character (e.g. a CSS id like #anc-tst-play-btn). Keys mirror the
# CLI/config names. List values are comma-separated. Booleans are true/false.
# CLI flags still override anything set here.

# --- target page ---
url =
# --- entry overlays (age gate, cookies) — clicked in order ---
# These can be any element (a <span>, link, button, ...). Use ids or selectors.
dismiss_id = disclaimer-over18btn, disclaimer-accept_cookies
# dismiss_selector = .age-gate .yes, #cookie-accept

# --- pick a video on the homepage ---
# Either a CSS selector (one match chosen at random)...
random_selector = div[id^=video_]
# ...or explicit ids:  random_ids = featured-1, featured-2
# ...or a fixed result to open:  result_selector = div.mb.hdy a
# random_seed = 42        # optional: reproducible pick

# --- skip a pre-roll ad ---
skip_ad_selector = text=Skip ad
ad_timeout_s = 15

# --- the player ---
video_selector = video
play_id = anc-tst-play-btn
# play_selector = .play-button            # ...or a CSS selector instead of id
# the span you click to go fullscreen:
fullscreen_selector = span.fullscreen
# ...or an element to call requestFullscreen() on:
# fullscreen_id = player-full-bleed-container

# --- capture / run options ---
mode = clip
# false = headed (often needed so the captured video isn't black):
headless = false
duration_s = 14.0
# clip resolution (also the browser viewport); default is 1920x1080:
viewport = 1920x1080
output_dir = ./vpv-artifacts
# browser_args = --disable-gpu, --use-gl=swiftshader   # headless software decode
